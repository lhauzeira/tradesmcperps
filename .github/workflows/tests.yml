name: SMC agent tests

on:
  push:
    branches:
      - main
      - feature/smc-agent-builders-v01
      - feature/signal-alerts-v02
      - feature/signal-lifecycle-v03
      - feature/native-quotes-v04
      - feature/xm-gold-risk-v05
      - feature/offline-paper-v06
      - feature/xm-gold-calendar-v07
      - feature/mt5-demo-monitor-v08
      - feature/mt5-clock-diagnostics-v09
      - feature/mt5-live-clock-v10
      - feature/windows-crlf-fix-v11
      - feature/multiasset-fibonacci-v12
      - feature/mt5-pretrade-readiness-v13
      - feature/multiasset-risk-guard-v14
      - release/smc-unificado-rc1
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feature/signal-alerts-v02
      - feature/signal-lifecycle-v03
      - feature/native-quotes-v04
      - feature/xm-gold-risk-v05
      - feature/offline-paper-v06
      - feature/xm-gold-calendar-v07
      - feature/mt5-demo-monitor-v08
      - feature/mt5-clock-diagnostics-v09
      - feature/mt5-live-clock-v10
      - feature/windows-crlf-fix-v11

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate unified offline suite and six fictitious scenarios
        run: python -m smc_agent.unified --validar-tudo
