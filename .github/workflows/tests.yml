name: SMC agent tests

on:
  push:
    branches:
      - main
      - feature/smc-agent-builders-v01
      - feature/signal-alerts-v02
      - feature/signal-lifecycle-v03
      - feature/native-quotes-v04
      - feature/xm-gold-risk-v05
      - feature/offline-paper-v06
      - feature/xm-gold-calendar-v07
      - feature/mt5-demo-monitor-v08
      - feature/mt5-clock-diagnostics-v09
      - feature/mt5-live-clock-v10
  pull_request:
    branches:
      - main
      - feature/signal-alerts-v02
      - feature/signal-lifecycle-v03
      - feature/native-quotes-v04
      - feature/xm-gold-risk-v05
      - feature/offline-paper-v06
      - feature/xm-gold-calendar-v07
      - feature/mt5-demo-monitor-v08
      - feature/mt5-clock-diagnostics-v09

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline Builder demo
        run: python -m smc_agent.demo
      - name: Run synthetic alert preview
        run: python -m smc_agent.alert_demo
      - name: Run synthetic lifecycle and SQLite journal demo
        run: python -m smc_agent.lifecycle_demo
      - name: Run synthetic bid-ask quote feed demo
        run: python -m smc_agent.quote_demo
      - name: Run synthetic XM GOLD risk calculation demo
        run: python -m smc_agent.xm_gold_risk
      - name: Run fabricated session-aware paper replay
        run: python -m smc_agent.paper_demo
      - name: Print XM session screenshot snapshot without assuming historical times
        run: python -m smc_agent.xm_calendar
