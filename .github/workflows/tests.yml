name: SMC agent tests

on:
  push:
    branches:
      - main
      - feature/smc-agent-builders-v01
      - feature/signal-alerts-v02
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline Builder demo
        run: python -m smc_agent.demo
      - name: Run synthetic alert preview
        run: python -m smc_agent.alert_demo
